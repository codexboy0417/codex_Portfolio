name: Sync LinkedIn Connections

on:
  schedule:
    # Run automatically every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch LinkedIn Connections
        env:
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
        run: |
          python scripts/sync_linkedin.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/connections.json
          git diff --staged --quiet || (git commit -m "chore(network): sync live LinkedIn connections" && git push)
